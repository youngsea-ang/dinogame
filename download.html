<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공룡 점프 게임 다운로드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    background:#f7f7f7; font-family:"Malgun Gothic", sans-serif; flex-direction:column;
  }
  .wrap { text-align:center; max-width:480px; padding:20px; }
  h1 { font-size:28px; color:#535353; margin-bottom:10px; letter-spacing:1px; }
  p { color:#767676; font-size:15px; margin-bottom:30px; line-height:1.6; }
  .download-btn {
    display:inline-block;
    background:#535353;
    color:#ffffff;
    text-decoration:none;
    padding:14px 32px;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
    transition: background 0.2s;
  }
  .download-btn:hover { background:#333333; }
  .ground {
    margin-top:40px;
    border-bottom:2px solid #535353;
    width:100%;
  }
  .note { margin-top:16px; font-size:12px; color:#aaaaaa; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🦖 공룡 점프 게임</h1>
  <p>
    크롬 오프라인 공룡 게임을 파이썬으로 직접 만든 버전이에요.<br>
    아래 버튼을 누르면 실행파일(.exe)이 바로 다운로드돼요.<br>
    파이썬 설치 없이 더블클릭만 하면 바로 플레이할 수 있어요.
  </p>
  <!-- ↓↓↓ 여기 href 부분을 1단계에서 복사한 Release 다운로드 링크로 바꿔주세요 ↓↓↓ -->
  <a class="download-btn" href="https://github.com/youngsea-ang/dinogame/releases/download/v1.0/dinogame.exe" download>
    다운로드 (Windows .exe)
  </a>
  <div class="ground"></div>
  <p class="note">Windows 전용 · 약 26MB · 첫 실행 시 백신 경고가 떠도 정상이에요</p>
</div>
</body>
</html>
